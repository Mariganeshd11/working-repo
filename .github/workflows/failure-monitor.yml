name: Failure Monitor (Event + Polling)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [client_repo_failure]

permissions:
  contents: read

jobs:
  poll-and-extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Process failure
        env:
          CLIENT_REPO_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
          ES_ENDPOINT: ${{ secrets.ES_ENDPOINT }}
          ES_API_KEY: ${{ secrets.ES_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            python scripts/fetch_failures.py \
              --owner ${{ secrets.CLIENT_REPO_OWNER }} \
              --repo ${{ secrets.CLIENT_REPO_NAME }} \
              --run-id ${{ github.event.client_payload.run_id }}
          else
            python scripts/fetch_failures.py \
              --owner ${{ secrets.CLIENT_REPO_OWNER }} \
              --repo ${{ secrets.CLIENT_REPO_NAME }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: failure-reports-${{ github.run_id }}
          path: data/failures/*.json
          if-no-files-found: warn